<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1e3c"/><stop offset="0.5" stop-color="#0f3460"/><stop offset="1" stop-color="#0d5c70"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f5a623"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="74" fill="#ffffff" font-size="38" font-weight="800">The Golden Circle</text>
  <text x="64" y="110" fill="#9fc3e8" font-size="19">People don't buy what you do — they buy why you do it. We start with WHY.</text>

  <!-- Concentric rings -->
  <g transform="translate(400,410)">
    <circle r="280" fill="#11407a" opacity="0.35"/>
    <circle r="280" fill="none" stroke="#2e72b8" stroke-width="2"/>
    <circle r="190" fill="#0d6b6f" opacity="0.35"/>
    <circle r="190" fill="none" stroke="#14a085" stroke-width="2"/>
    <circle r="105" fill="url(#gold)"/>
    <text y="-208" text-anchor="middle" fill="#9fc3e8" font-size="20" font-weight="700" letter-spacing="4">WHAT</text>
    <text y="-122" text-anchor="middle" fill="#3fe0bd" font-size="20" font-weight="700" letter-spacing="4">HOW</text>
    <text y="-10" text-anchor="middle" fill="#0f3460" font-size="34" font-weight="800" letter-spacing="3">WHY</text>
    <text y="26" text-anchor="middle" fill="#0f3460" font-size="14" font-weight="600">our purpose</text>
  </g>

  <g font-size="17">
    <!-- WHY -->
    <line x1="505" y1="405" x2="748" y2="232" stroke="#f5a623" stroke-width="2.5"/>
    <circle cx="505" cy="405" r="5" fill="#f5a623"/>
    <text x="762" y="206" fill="#ffd166" font-size="23" font-weight="800">WHY  ·  the belief</text>
    <text x="762" y="240" fill="#ffffff" font-size="18" font-weight="600">No student should fail a course they were capable of</text>
    <text x="762" y="266" fill="#ffffff" font-size="18" font-weight="600">passing simply because they couldn't start on time.</text>
    <text x="762" y="292" fill="#bcd4ee">Procrastination is an emotional problem, not a knowledge gap.</text>

    <!-- HOW -->
    <line x1="558" y1="430" x2="748" y2="410" stroke="#14a085" stroke-width="2.5"/>
    <circle cx="558" cy="430" r="5" fill="#14a085"/>
    <text x="762" y="398" fill="#3fe0bd" font-size="23" font-weight="800">HOW  ·  what's unique</text>
    <text x="762" y="430" fill="#e8f1fb">Real stakes — effort tied to actual grade bonuses</text>
    <text x="762" y="456" fill="#e8f1fb">Verified focus — points earned, not gamed</text>
    <text x="762" y="482" fill="#e8f1fb">Live competition — per-course leaderboards build habit</text>

    <!-- WHAT -->
    <line x1="505" y1="475" x2="748" y2="585" stroke="#2e72b8" stroke-width="2.5"/>
    <circle cx="505" cy="475" r="5" fill="#2e72b8"/>
    <text x="762" y="572" fill="#9fc3e8" font-size="23" font-weight="800">WHAT  ·  the product</text>
    <text x="762" y="604" fill="#e8f1fb">A gamified academic platform: leaderboard, streaks,</text>
    <text x="762" y="630" fill="#e8f1fb">smart task prioritiser, 4-week grade predictions, a</text>
    <text x="762" y="656" fill="#e8f1fb">privacy-safe Focus Monitor, and an instructor dashboard.</text>
  </g>
</svg>
