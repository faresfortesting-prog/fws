<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="64" fill="#0f3460" font-size="36" font-weight="800">Competitive Positioning Map</text>
  <text x="64" y="98" fill="#6b7f99" font-size="18">StudyStrike owns the empty corner: academically integrated <tspan font-weight="700">and</tspan> built for active, accountable motivation</text>

  <!-- Plot area -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="900" height="480" fill="#f8fafd" stroke="#e2eaf4"/>
    <!-- quadrant tint for whitespace -->
    <rect x="450" y="0" width="450" height="240" fill="#e7f7f2" opacity="0.6"/>

    <!-- Axes -->
    <line x1="0" y1="240" x2="900" y2="240" stroke="#c8d8ed" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="480" stroke="#c8d8ed" stroke-width="2"/>

    <!-- Axis labels -->
    <text x="450" y="-14" text-anchor="middle" fill="#1a2540" font-size="19" font-weight="700">HIGH motivation &amp; accountability (social · verified)</text>
    <text x="450" y="510" text-anchor="middle" fill="#1a2540" font-size="19" font-weight="700">LOW — passive tracking, self-reported</text>
    <text x="-14" y="240" text-anchor="middle" fill="#1a2540" font-size="19" font-weight="700" transform="rotate(-90 -14,240)">Generic productivity</text>
    <text x="914" y="240" text-anchor="middle" fill="#1a2540" font-size="19" font-weight="700" transform="rotate(-90 914,240)">Academic / grade-integrated</text>

    <!-- Competitor dots -->
    <g font-size="16" fill="#1a2540">
      <!-- Notion: generic, passive -->
      <circle cx="150" cy="360" r="9" fill="#6b7f99"/><text x="166" y="365">Notion</text>
      <!-- Todoist -->
      <circle cx="100" cy="300" r="9" fill="#6b7f99"/><text x="116" y="305">Todoist</text>
      <!-- Forest: generic-ish, mid motivation (focus) -->
      <circle cx="250" cy="170" r="9" fill="#27ae60"/><text x="266" y="175">Forest</text>
      <!-- Habitica: generic gamified -->
      <circle cx="180" cy="130" r="9" fill="#7a5c9e"/><text x="196" y="135">Habitica</text>
      <!-- Duolingo: strong game loop, not academic-course -->
      <circle cx="330" cy="95" r="9" fill="#7a5c9e"/><text x="346" y="100">Duolingo (ref.)</text>
      <!-- Blackboard / LMS: academic, passive -->
      <circle cx="690" cy="380" r="9" fill="#1a5490"/><text x="706" y="385">Blackboard / LMS</text>
      <!-- MyStudyLife: academic-ish, low motivation -->
      <circle cx="600" cy="330" r="9" fill="#1a5490"/><text x="616" y="335">MyStudyLife</text>
    </g>

    <!-- StudyStrike star -->
    <g transform="translate(720,110)">
      <circle r="26" fill="#f5a623" stroke="#0f3460" stroke-width="3"/>
      <text x="0" y="6" text-anchor="middle" fill="#0f3460" font-size="22" font-weight="800">★</text>
      <text x="36" y="-4" fill="#0f3460" font-size="20" font-weight="800">StudyStrike</text>
      <text x="36" y="20" fill="#0d7377" font-size="15" font-weight="600">Grade-linked + verified focus</text>
    </g>
  </g>

  <text x="150" y="678" fill="#6b7f99" font-size="15">Why these axes: students don't lack task lists — they lack <tspan font-weight="700">academic stakes</tspan> and <tspan font-weight="700">accountability</tspan>. The top-right quadrant is unserved.</text>
</svg>
