<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="60" y="56" fill="#0f3460" font-size="34" font-weight="800">Competitive Positioning Map</text>
  <text x="60" y="88" fill="#6b7f99" font-size="17">The top-right quadrant — academically integrated <tspan font-weight="700">and</tspan> built for verified, social accountability — is unserved. We own it.</text>

  <g transform="translate(150,135)">
    <rect x="0" y="0" width="860" height="480" fill="#f8fafd" stroke="#e2eaf4"/>
    <!-- whitespace quadrant -->
    <rect x="430" y="0" width="430" height="240" fill="#e7f7f2"/>
    <text x="645" y="34" text-anchor="middle" fill="#0d7377" font-size="15" font-weight="700" letter-spacing="1">DEFENSIBLE WHITESPACE</text>

    <!-- axes -->
    <line x1="0" y1="240" x2="860" y2="240" stroke="#c8d8ed" stroke-width="2"/>
    <line x1="430" y1="0" x2="430" y2="480" stroke="#c8d8ed" stroke-width="2"/>

    <!-- axis labels -->
    <text x="430" y="-12" text-anchor="middle" fill="#1a2540" font-size="18" font-weight="700">HIGH motivation &amp; accountability  ·  social + verified</text>
    <text x="430" y="506" text-anchor="middle" fill="#1a2540" font-size="18" font-weight="700">LOW  ·  passive, self-reported tracking</text>
    <text x="-16" y="240" text-anchor="middle" fill="#1a2540" font-size="18" font-weight="700" transform="rotate(-90 -16,240)">Generic productivity</text>
    <text x="876" y="240" text-anchor="middle" fill="#1a2540" font-size="18" font-weight="700" transform="rotate(-90 876,240)">Academic / grade-integrated</text>

    <!-- competitors -->
    <g font-size="15" fill="#1a2540">
      <circle cx="120" cy="360" r="8" fill="#6b7f99"/><text x="135" y="365">Notion</text>
      <circle cx="90" cy="300" r="8" fill="#6b7f99"/><text x="105" y="305">Todoist</text>
      <circle cx="230" cy="160" r="8" fill="#27ae60"/><text x="245" y="165">Forest</text>
      <circle cx="160" cy="120" r="8" fill="#7a5c9e"/><text x="175" y="125">Habitica</text>
      <circle cx="320" cy="90" r="8" fill="#7a5c9e"/><text x="335" y="95">Duolingo (ref.)</text>
      <circle cx="660" cy="380" r="8" fill="#1a5490"/><text x="675" y="385">Blackboard / LMS</text>
      <circle cx="560" cy="320" r="8" fill="#1a5490"/><text x="575" y="325">MyStudyLife</text>
    </g>

    <!-- dashed moat ring -->
    <circle cx="690" cy="115" r="70" fill="none" stroke="#0d7377" stroke-width="2" stroke-dasharray="6 5"/>

    <!-- StudyStrike -->
    <g transform="translate(690,115)">
      <circle r="27" fill="#f5a623" stroke="#0f3460" stroke-width="3"/>
      <text x="0" y="7" text-anchor="middle" fill="#0f3460" font-size="24" font-weight="800">★</text>
      <text x="38" y="-4" fill="#0f3460" font-size="19" font-weight="800">StudyStrike</text>
      <text x="38" y="19" fill="#0d7377" font-size="14" font-weight="600">grade-linked + verified focus</text>
    </g>
  </g>

  <!-- right rail rationale -->
  <g transform="translate(1045,150)">
    <text x="0" y="14" fill="#0f3460" font-size="17" font-weight="800">Why these axes?</text>
    <text x="0" y="46" fill="#1a2540" font-size="14">Students don't lack task</text>
    <text x="0" y="68" fill="#1a2540" font-size="14">lists or even gamification.</text>
    <text x="0" y="90" fill="#1a2540" font-size="14">They lack <tspan font-weight="700">academic stakes</tspan></text>
    <text x="0" y="112" fill="#1a2540" font-size="14">and <tspan font-weight="700">accountability</tspan>.</text>

    <text x="0" y="156" fill="#0f3460" font-size="17" font-weight="800">Why it's defensible</text>
    <text x="0" y="188" fill="#1a2540" font-size="14">A leaderboard is easy to</text>
    <text x="0" y="210" fill="#1a2540" font-size="14">copy. A <tspan font-weight="700" fill="#0d7377">verified</tspan> link between</text>
    <text x="0" y="232" fill="#1a2540" font-size="14">daily effort and real grades</text>
    <text x="0" y="254" fill="#1a2540" font-size="14">is not.</text>
  </g>
</svg>
